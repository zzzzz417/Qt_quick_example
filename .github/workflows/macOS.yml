name: macOS Buildon:  workflow_call:  workflow_dispatch:jobs:  build:    name: macOS-Universal    runs-on: macos-14    steps:      - name: Checkout repository        uses: actions/checkout@v4        with:          submodules: recursive      - name: Setup Ninja        uses: ashutoshvarma/setup-ninja@master        with:          version: 1.11.1      - name: Install Qt 6.5.3        uses: jurplel/install-qt-action@v4        with:          version: '6.5.3'          cache: true          cache-key-prefix: 'install-qt-macos-universal'      - name: Setup Environment        shell: bash        run: |          echo "CMAKE_PREFIX_PATH=$QT_ROOT_DIR" >> $GITHUB_ENV          echo "CMAKE_GENERATOR=Ninja" >> $GITHUB_ENV      # 使用 CMAKE_OSX_ARCHITECTURES 同时编译 arm64 与 x86_64      - name: Run CMake Preset Release (Universal Binary)        run: |          cmake --workflow --preset release      - name: Package Dist        shell: bash        run: |          mkdir -p package          tar -czvf "package/InnoStudio-macOS-Universal.tar.gz" -C dist .      - name: Upload Artifact        uses: actions/upload-artifact@v4        with:          name: InnoStudio-macOS-Universal          path: package/*          retention-days: 7