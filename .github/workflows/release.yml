name: Multi-Platform Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. 触发 Windows 构建
  build-windows:
    uses: ./.github/workflows/windows.yml

  # 2. 触发 Linux 构建
  build-linux:
    uses: ./.github/workflows/linux.yml

  # 3. 触发 macOS 构建
  build-macos:
    uses: ./.github/workflows/macOS.yml

  # 4. 汇总发布任务（成功多少发布多少）
  publish-release:
    name: Publish Release Packages
    needs: [build-windows, build-linux, build-macos]
    # 只要由 Tag 触发且未被整体取消，无论子任务成败均执行
    if: always() && startsWith(github.ref, 'refs/tags/v') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      # 下载所有子任务上传成功的包
      - name: Download all available artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: all-packages
          merge-multiple: true

      # 检查是否有任何构建包成功生成
      - name: Check Artifacts Existence
        id: check-files
        shell: bash
        run: |
          if [ -d "all-packages" ] && [ "$(ls -A all-packages 2>/dev/null)" ]; then
            echo "Found packages to release:"
            ls -lh all-packages
            echo "has_files=true" >> $GITHUB_OUTPUT
          else
            echo "No packages were successfully built."
            echo "has_files=false" >> $GITHUB_OUTPUT
          fi

      # 只要有成功构建的产物，就创建/更新 GitHub Release 并上传附件
      - name: Create or Update GitHub Release
        if: steps.check-files.outputs.has_files == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: all-packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
